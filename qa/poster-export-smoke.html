<!doctype html>
<meta charset="utf-8">
<title>Poster export smoke test</title>
<canvas id="posterCanvas" width="800" height="600"></canvas>
<output id="result">running</output>
<script type="module">
  import { PosterRenderer } from '../dist/logic/posterRenderer.js';
  import { cancerDesignPresetList } from '../dist/logic/cancerDesignPresets.js';
  import { approvedRoofPairs, getRecommendedRoofScheme, roofStyles } from '../dist/logic/roofStyles.js';
  import { roofMaterialLibrary } from '../dist/logic/roofMaterials.js';
  import { recommendedClassicRoofSelection, recommendedRoofSelection } from '../dist/logic/roofSelection.js';

  const canvas = document.querySelector('canvas');
  const renderer = new PosterRenderer(canvas);
  const customColors = {
    headerC1: '#123B5D', headerC2: '#2F8FA8', headerC3: '#E8F8F7',
    agendaBg: '#E8F5E8', agendaBorder: '#123B5D', agendaAccent: '#123B5D',
    bgC1: '#ffffff', bgC2: '#ffffff', bgGradientDir: 'none'
  };
  const agendaItems = [{ time: '09:00', topic: 'Opening', speaker: 'Speaker', moderator: 'Moderator' }];
  const conferenceData = {
    title: '2026 年精準醫療與跨領域癌症免疫治療最新進展國際研討會',
    subtitle: 'Cancer Forum', date: '2026/08/19', time: '09:00–12:00', location: 'Taipei'
  };
  const colorsFor = scheme => ({
    headerC1: scheme.header.colors[0], headerC2: scheme.header.colors[1], headerC3: scheme.header.colors[2],
    agendaBg: scheme.agenda.background, agendaBorder: scheme.agenda.border, agendaAccent: scheme.agenda.accent,
    bgC1: '#ffffff', bgC2: '#ffffff', bgGradientDir: 'none'
  });
  let renderedVariants = 0;
  for (const style of roofStyles) await roofMaterialLibrary.preload(style.id);
  for (const pair of approvedRoofPairs) {
    const scheme = getRecommendedRoofScheme(pair.cancerId, pair.styleId);
    renderer.setRoofSelection(pair.cancerId, recommendedRoofSelection(pair.cancerId, pair.styleId));
    renderer.drawPoster(agendaItems, pair.cancerId, 'optical_recommended', 'horizontal', colorsFor(scheme), conferenceData, false, '', [], 1);
    renderedVariants += 1;
  }
  for (const preset of cancerDesignPresetList) {
    renderer.setRoofSelection(preset.id, recommendedClassicRoofSelection(preset.id));
    const scheme = getRecommendedRoofScheme(preset.id, approvedRoofPairs.find(pair => pair.cancerId === preset.id).styleId);
    renderer.drawPoster(agendaItems, preset.id, preset.colorScheme, 'horizontal', { ...colorsFor(scheme),
      headerC1: preset.palette[0], headerC2: preset.palette[1], headerC3: preset.palette[2]
    }, conferenceData, false, '', [], 1);
    renderedVariants += 1;
  }

  const layerSourceCanvas = document.createElement('canvas');
  layerSourceCanvas.width = 800;
  layerSourceCanvas.height = 600;
  const layerSourceContext = layerSourceCanvas.getContext('2d');
  layerSourceContext.fillStyle = '#ff00ff';
  layerSourceContext.fillRect(0, 0, 800, 600);
  const layerImage = new Image();
  await new Promise((resolve, reject) => {
    layerImage.onload = resolve;
    layerImage.onerror = reject;
    layerImage.src = layerSourceCanvas.toDataURL('image/png');
  });
  const compositorTestOverlay = {
    id: 999, name: 'independent compositor test', img: layerImage, src: layerImage.src,
    x: 400, y: 300, w: 800, h: 600, scaleX: 1, scaleY: 1,
    rotation: 0, opacity: 1, visible: true, lockAspect: true, zIndex: 1,
    aboveTable: false, aboveHeader: true
  };
  renderer.setRoofSelection('lung', recommendedClassicRoofSelection('lung'));
  renderer.drawPoster(agendaItems, 'lung', 'cancer_lung', 'horizontal', customColors, conferenceData, false, '', [compositorTestOverlay], 1);
  const reverseHeaderPixel = Array.from(canvas.getContext('2d').getImageData(20, 20, 1, 1).data);
  const reverseTablePixel = Array.from(canvas.getContext('2d').getImageData(400, 360, 1, 1).data);

  compositorTestOverlay.aboveTable = true;
  compositorTestOverlay.aboveHeader = false;
  renderer.drawPoster(agendaItems, 'lung', 'cancer_lung', 'horizontal', customColors, conferenceData, false, '', [compositorTestOverlay], 1);
  const originalHeaderPixel = Array.from(canvas.getContext('2d').getImageData(20, 20, 1, 1).data);
  const originalTablePixel = Array.from(canvas.getContext('2d').getImageData(400, 360, 1, 1).data);
  const independentRelationsVerified = reverseHeaderPixel.slice(0, 3).join(',') === '255,0,255'
    && reverseTablePixel.slice(0, 3).join(',') !== '255,0,255'
    && originalHeaderPixel.slice(0, 3).join(',') !== '255,0,255'
    && originalTablePixel.slice(0, 3).join(',') === '255,0,255';

  window.app = {
    getAppState: () => ({
      agendaItems, currentTemplate: 'lung', currentColorScheme: 'cancer_lung',
      currentGradientDirection: 'horizontal', customColors, overlays: []
    }),
    getConferenceData: () => conferenceData,
    formControls: { getTableOpacity: () => 1 }
  };
  renderer.setRoofSelection('lung', recommendedClassicRoofSelection('lung'));
  const png = await renderer.exportHighQuality('png', 0.95, 3);
  const jpeg = await renderer.exportHighQuality('jpeg', 0.95, 3);
  const pngBitmap = await createImageBitmap(png.blob), jpegBitmap = await createImageBitmap(jpeg.blob);
  document.querySelector('#result').textContent = JSON.stringify({
    renderedVariants,
    exports: [
      { mime: png.blob.type, bytes: png.blob.size, original: png.originalSize, highQuality: png.highQualitySize,
        bitmap: { width: pngBitmap.width, height: pngBitmap.height } },
      { mime: jpeg.blob.type, bytes: jpeg.blob.size, original: jpeg.originalSize, highQuality: jpeg.highQualitySize,
        bitmap: { width: jpegBitmap.width, height: jpegBitmap.height } }
    ],
    independentRelationsVerified,
    reverseHeaderPixel,
    reverseTablePixel,
    originalHeaderPixel,
    originalTablePixel
  });
</script>
