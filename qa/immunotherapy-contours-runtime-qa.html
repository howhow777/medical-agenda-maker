<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>屋簷收斂｜Runtime QA</title>
  <style>
    :root{color-scheme:light;font-family:"Microsoft JhengHei","PingFang TC",sans-serif}*{box-sizing:border-box}
    body{margin:0;background:#f1f3f8;color:#20273a}main{width:min(1500px,calc(100% - 32px));margin:24px auto 48px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}h1{margin:0 0 6px;font-size:clamp(24px,3vw,38px)}
    p{margin:0;color:#667085}#status{padding:10px 14px;border-radius:999px;background:#fff;box-shadow:0 4px 18px #27346618;font-weight:700}
    #status.pass{color:#12653a;background:#e8f8ef}#status.fail{color:#9a251e;background:#fff0ee}
    .matrix{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:14px}article{overflow:hidden;border:1px solid #dfe3ed;border-radius:15px;background:#fff;box-shadow:0 7px 24px #27346612}
    canvas{width:100%;height:auto;display:block;background:#fff}.caption{display:flex;justify-content:space-between;gap:10px;padding:9px 11px 11px;font-size:12px}.caption strong{font-size:13px}.caption span{color:#667085}
    pre{margin-top:18px;padding:16px;overflow:auto;border-radius:14px;background:#161b2d;color:#dfe8ff;line-height:1.55}
    @media(max-width:900px){.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}}@media(max-width:470px){main{width:min(100% - 20px,1500px);margin-top:12px}.matrix{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>24 組正式屋簷 Runtime QA</h1><p>18 組核准光影＋6 組最初版波浪；直接使用正式 PosterRenderer 與高畫質匯出。</p></div><output id="status">驗證中…</output></header>
  <section id="matrix" class="matrix" aria-label="24 種執行期組合"></section>
  <pre id="report" aria-live="polite"></pre>
</main>
<script type="module">
  import { PosterRenderer, partitionOverlayLayers } from '../dist/logic/posterRenderer.js';
  import { cancerDesignPresetList, cancerDesignPresets } from '../dist/logic/cancerDesignPresets.js';
  import { colorSchemes } from '../dist/logic/colorSchemes.js';
  import { approvedRoofPairs, getRecommendedRoofScheme, getRoofStyle, roofStyles } from '../dist/logic/roofStyles.js';
  import { roofMaterialLibrary } from '../dist/logic/roofMaterials.js';
  import { recommendedClassicRoofSelection, recommendedRoofSelection } from '../dist/logic/roofSelection.js';

  const matrix = document.querySelector('#matrix'), status = document.querySelector('#status'), report = document.querySelector('#report');
  const agenda = [{ time:'09:00', topic:'Cancer Immunotherapy', speaker:'Speaker', moderator:'Moderator' }];
  const conference = { title:'2026 年癌症醫學會議', subtitle:'癌症免疫治療研討會', date:'2026/09/16', time:'09:00–12:00', location:'Taipei' };
  const custom = scheme => ({ headerC1:scheme.header.colors[0],headerC2:scheme.header.colors[1],headerC3:scheme.header.colors[2],agendaBg:scheme.agenda.background,agendaBorder:scheme.agenda.border,agendaAccent:scheme.agenda.accent,bgC1:'#fff',bgC2:'#fff',bgGradientDir:'none' });
  const hasInk = canvas => canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data.some((value,index) => index % 4 !== 3 && value > 0 && value < 250);
  const exportImage = async (renderer, format) => {
    const result = await renderer.exportHighQuality(format,.95,3), bitmap = await createImageBitmap(result.blob);
    return { format, bytes:result.blob.size, width:bitmap.width, height:bitmap.height, pass:result.blob.size > 0 && bitmap.width === 2400 && bitmap.height === 1800 };
  };
  function relationsPass(){
    const overlays=[{id:1,aboveTable:true,aboveHeader:true},{id:2,aboveTable:true,aboveHeader:false},{id:3,aboveTable:false,aboveHeader:true},{id:4,aboveTable:false,aboveHeader:false}];
    const value=partitionOverlayLayers(overlays);
    return JSON.stringify([value.belowTable.map(x=>x.id),value.aboveTable.map(x=>x.id),value.belowHeader.map(x=>x.id),value.aboveHeader.map(x=>x.id)])===JSON.stringify([[3,4],[1,2],[2,4],[1,3]]);
  }
  function card(canvas,title,label){const article=document.createElement('article'),caption=document.createElement('div');caption.className='caption';caption.innerHTML=`<strong>${title}</strong><span>${label}</span>`;article.append(canvas,caption);matrix.append(article)}

  async function run(){
    for(const style of roofStyles) await roofMaterialLibrary.preload(style.id);
    const cases=[];
    for(const pair of approvedRoofPairs){
      const canvas=Object.assign(document.createElement('canvas'),{width:800,height:600}),renderer=new PosterRenderer(canvas),scheme=getRecommendedRoofScheme(pair.cancerId,pair.styleId);
      renderer.setRoofSelection(pair.cancerId,recommendedRoofSelection(pair.cancerId,pair.styleId));
      renderer.drawPoster(agenda,pair.cancerId,'optical_recommended','horizontal',custom(scheme),conference,false,'',[],1);
      const exports=[await exportImage(renderer,'png'),await exportImage(renderer,'jpeg')];
      const item={cancerId:pair.cancerId,kind:'optical',styleId:pair.styleId,nonempty:hasInk(canvas),exports};cases.push(item);card(canvas,cancerDesignPresets[pair.cancerId].label,getRoofStyle(pair.styleId).label);
    }
    for(const preset of cancerDesignPresetList){
      const canvas=Object.assign(document.createElement('canvas'),{width:800,height:600}),renderer=new PosterRenderer(canvas),scheme=colorSchemes[preset.colorScheme];
      renderer.setRoofSelection(preset.id,recommendedClassicRoofSelection(preset.id));
      renderer.drawPoster(agenda,preset.id,preset.colorScheme,'horizontal',custom(scheme),conference,false,'',[],1);
      const exports=[await exportImage(renderer,'png'),await exportImage(renderer,'jpeg')];
      const item={cancerId:preset.id,kind:'classic',nonempty:hasInk(canvas),exports};cases.push(item);card(canvas,preset.label,'最初版波浪屋簷');
    }
    const result={materialAssetsLoaded:`${roofMaterialLibrary.loadedStyleIds.length}/6`,opticalRendered:`${cases.filter(x=>x.kind==='optical').length}/18`,classicRendered:`${cases.filter(x=>x.kind==='classic').length}/6`,highResolutionExports:`${cases.filter(x=>x.exports.every(e=>e.pass)).length}/24`,independentRelationsVerified:relationsPass(),cases};
    result.passed=result.materialAssetsLoaded==='6/6'&&result.opticalRendered==='18/18'&&result.classicRendered==='6/6'&&result.highResolutionExports==='24/24'&&result.independentRelationsVerified&&cases.every(x=>x.nonempty);
    window.__immunotherapyQA=result;status.textContent=result.passed?'PASS · 24/24':'FAIL';status.className=result.passed?'pass':'fail';report.textContent=JSON.stringify(result,null,2);
  }
  run().catch(error=>{const result={passed:false,error:String(error?.stack||error)};window.__immunotherapyQA=result;status.textContent='FAIL';status.className='fail';report.textContent=JSON.stringify(result,null,2);console.error(error)});
</script></body></html>
