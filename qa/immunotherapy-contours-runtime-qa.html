<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>癌症免疫療法輪廓｜Runtime QA</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f3f8; color: #20273a; }
    main { width: min(1500px, calc(100% - 32px)); margin: 24px auto 48px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 38px); }
    p { margin: 0; color: #667085; }
    #status { padding: 10px 14px; border-radius: 999px; background: #fff; box-shadow: 0 4px 18px #27346618; font-weight: 700; }
    #status.pass { color: #12653a; background: #e8f8ef; }
    #status.fail { color: #9a251e; background: #fff0ee; }
    .matrix { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; }
    article { overflow: hidden; border: 1px solid #dfe3ed; border-radius: 15px; background: #fff; box-shadow: 0 7px 24px #27346612; }
    canvas { width: 100%; height: auto; display: block; background: white; }
    .caption { display: flex; justify-content: space-between; gap: 10px; padding: 9px 11px 11px; font-size: 12px; }
    .caption strong { font-size: 13px; }
    .caption span { color: #667085; }
    pre { margin-top: 18px; padding: 16px; overflow: auto; border-radius: 14px; background: #161b2d; color: #dfe8ff; line-height: 1.55; }
    @media (max-width: 900px) { .matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { align-items: start; flex-direction: column; } }
    @media (max-width: 470px) { main { width: min(100% - 20px, 1500px); margin-top: 12px; } .matrix { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>24 組癌別 × 輪廓 Runtime QA</h1>
        <p>直接載入編譯後模組；同時驗證共用幾何、Agenda 聯動與 2400×1800 輸出。</p>
      </div>
      <output id="status">驗證中…</output>
    </header>
    <section id="matrix" class="matrix" aria-label="24 種執行期組合"></section>
    <pre id="report" aria-live="polite"></pre>
  </main>
  <script type="module">
    import { cancerDesignPresetList } from '../dist/logic/cancerDesignPresets.js';
    import { colorSchemes } from '../dist/logic/colorSchemes.js';
    import {
      createContourGradient,
      drawHeaderContour,
      headerContourIds,
      headerContourLabels
    } from '../dist/logic/headerContours.js';
    import { partitionOverlayLayers } from '../dist/logic/posterRenderer.js';

    const matrix = document.querySelector('#matrix');
    const status = document.querySelector('#status');
    const report = document.querySelector('#report');

    function drawCombination(canvas, preset, contourId) {
      const ctx = canvas.getContext('2d');
      const scheme = colorSchemes[preset.colorScheme];
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawHeaderContour(ctx, contourId, canvas.width, 90, createContourGradient(ctx, preset.palette, canvas.width, 90));
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      ctx.font = '700 17px Microsoft JhengHei';
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = scheme.agenda.accent;
      ctx.strokeText(`${preset.label}免疫治療研討會`, canvas.width / 2, 34);
      ctx.fillStyle = '#fff';
      ctx.fillText(`${preset.label}免疫治療研討會`, canvas.width / 2, 34);
      ctx.font = '12px Microsoft JhengHei';
      ctx.strokeText(headerContourLabels[contourId], canvas.width / 2, 56);
      ctx.fillText(headerContourLabels[contourId], canvas.width / 2, 56);
      const agenda = ctx.createLinearGradient(18, 0, canvas.width - 18, 0);
      scheme.header.colors.forEach((color, index) => agenda.addColorStop(index / 2, color));
      ctx.fillStyle = agenda;
      ctx.fillRect(18, 108, canvas.width - 36, 24);
      ctx.fillStyle = scheme.agenda.background;
      ctx.fillRect(18, 132, canvas.width - 36, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '700 10px Arial';
      ctx.fillText('Time      Content      Speaker', canvas.width / 2, 124);
    }

    function verifyIndependentRelations() {
      const overlays = [
        { id: 1, aboveTable: true, aboveHeader: true },
        { id: 2, aboveTable: true, aboveHeader: false },
        { id: 3, aboveTable: false, aboveHeader: true },
        { id: 4, aboveTable: false, aboveHeader: false }
      ];
      const result = partitionOverlayLayers(overlays);
      return JSON.stringify({
        belowTable: result.belowTable.map(item => item.id),
        aboveTable: result.aboveTable.map(item => item.id),
        belowHeader: result.belowHeader.map(item => item.id),
        aboveHeader: result.aboveHeader.map(item => item.id)
      }) === JSON.stringify({
        belowTable: [3, 4], aboveTable: [1, 2], belowHeader: [2, 4], aboveHeader: [1, 3]
      });
    }

    async function verifyHighResolutionContours() {
      const results = [];
      for (const contourId of headerContourIds) {
        const canvas = document.createElement('canvas');
        canvas.width = 2400;
        canvas.height = 1800;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const palette = cancerDesignPresetList[0].palette;
        drawHeaderContour(ctx, contourId, 2400, 450, createContourGradient(ctx, palette, 2400, 450));
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        results.push({ contourId, width: canvas.width, height: canvas.height, blobBytes: blob?.size || 0 });
      }
      return results;
    }

    async function run() {
      let renderedCombinations = 0;
      for (const preset of cancerDesignPresetList) {
        for (const contourId of headerContourIds) {
          const card = document.createElement('article');
          const canvas = document.createElement('canvas');
          canvas.width = 360;
          canvas.height = 160;
          canvas.dataset.preset = preset.id;
          canvas.dataset.contour = contourId;
          drawCombination(canvas, preset, contourId);
          const caption = document.createElement('div');
          caption.className = 'caption';
          caption.innerHTML = `<strong>${preset.label}</strong><span>${headerContourLabels[contourId]}</span>`;
          card.append(canvas, caption);
          matrix.append(card);
          renderedCombinations += 1;
        }
      }

      const independentRelationsVerified = verifyIndependentRelations();
      const highResolutionExports = await verifyHighResolutionContours();
      const noEmptyExports = highResolutionExports.every(item => item.width === 2400 && item.height === 1800 && item.blobBytes > 0);
      const result = {
        renderedCombinations,
        independentRelationsVerified,
        highResolutionExports,
        passed: renderedCombinations === 24 && independentRelationsVerified && noEmptyExports
      };
      window.__immunotherapyQA = result;
      status.textContent = result.passed ? 'PASS · 24/24' : 'FAIL';
      status.className = result.passed ? 'pass' : 'fail';
      report.textContent = JSON.stringify(result, null, 2);
    }

    run().catch(error => {
      const result = { passed: false, error: String(error?.stack || error) };
      window.__immunotherapyQA = result;
      status.textContent = 'FAIL';
      status.className = 'fail';
      report.textContent = JSON.stringify(result, null, 2);
      console.error(error);
    });
  </script>
</body>
</html>
